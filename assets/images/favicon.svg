<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E7B2"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#AA7A1E"/>
      <stop offset="100%" stop-color="#7B540A"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B1E26"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ring and Background Disk -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.85"/>

  <!-- Master Culinary Star / Fleur-de-lis Crest -->
  <g filter="url(#goldGlow)">
    <!-- Central Fleur / Flame Motif -->
    <path d="M32 14 C33.5 19 36 22 38 25 C36.5 25.5 34.5 25.2 32 23 C29.5 25.2 27.5 25.5 26 25 C28 22 30.5 19 32 14 Z" fill="url(#goldGrad)"/>
    <!-- Left Leaf -->
    <path d="M25 26 C20 23 16 27 18 31 C21 33 24 30.5 26 28 C25.5 27.2 25.2 26.6 25 26 Z" fill="url(#goldGrad)"/>
    <!-- Right Leaf -->
    <path d="M39 26 C44 23 48 27 46 31 C43 33 40 30.5 38 28 C38.5 27.2 38.8 26.6 39 26 Z" fill="url(#goldGrad)"/>
    <!-- Central Band -->
    <rect x="23" y="32" width="18" height="3" rx="1.5" fill="url(#goldGrad)"/>
    <!-- Lower Base -->
    <path d="M26 36 C28 41 30.5 45 32 48 C33.5 45 36 41 38 36 C35 37 29 37 26 36 Z" fill="url(#goldGrad)"/>
    <!-- Accent Diamond Dot -->
    <circle cx="32" cy="52" r="1.8" fill="url(#goldGrad)"/>
  </g>
</svg>
